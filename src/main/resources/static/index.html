<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support Copilot</title><style>:root{--bg:#0b0d10;--panel:#11151a;--panel2:#171c22;--border:#252c34;--text:#f4f6f8;--muted:#8e99a6;--accent:#7c5cff;--ok:#4ade80;--danger:#fb7185}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:300px 1fr}.side{border-right:1px solid var(--border);padding:20px 14px;overflow:auto}.brand{padding:4px 8px 18px}.section{font-size:10px;color:#687482;text-transform:uppercase;letter-spacing:.12em;margin:18px 8px 8px}.new,.scenario,.refresh{width:100%;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:10px;padding:10px;text-align:left;cursor:pointer;margin-bottom:7px}.approval{margin-bottom:8px;border:1px solid var(--border);border-radius:10px;background:#0f1317;padding:11px}.approval p{color:var(--muted);font-size:12px;margin:6px 0}.actions2{display:flex;gap:8px}.approve,.reject{border:0;border-radius:7px;padding:7px 10px;font-weight:700;cursor:pointer}.approve{background:var(--ok);color:#07110a}.reject{background:#32171e;color:#fff}.main{min-width:0}.top{height:64px;border-bottom:1px solid var(--border);padding:22px 28px}.chat{width:min(900px,100%);margin:auto;padding:32px 28px 150px}.hero h1{font-size:36px}.hero p{color:var(--muted)}.messages{display:flex;flex-direction:column;gap:18px}.msg{display:grid;grid-template-columns:34px 1fr;gap:12px}.avatar{width:34px;height:34px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-size:11px;font-weight:800}.bubble{font-size:14px;line-height:1.65;white-space:pre-wrap}.composer{position:fixed;left:300px;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:28px}.box{width:min(900px,100%);margin:auto;background:#14191f;border:1px solid #2b333d;border-radius:15px;padding:10px}textarea{width:100%;min-height:45px;background:transparent;border:0;outline:0;color:#fff}.send{float:right;background:var(--accent);border:0;color:#fff;border-radius:8px;padding:9px 14px}.error{color:var(--danger)}@media(max-width:800px){.app{grid-template-columns:1fr}.side{display:none}.composer{left:0}}</style></head><body><div class="app"><aside class="side"><div class="brand"><b>Support Copilot</b><small style="display:block;color:#8e99a6">Human-in-the-Loop</small></div><button class="new" onclick="newChat()">＋ New conversation</button><div class="section">Scenarios</div><button class="scenario" onclick="useCase('My order 1002 is five days late. I want a refund.')">Delayed refund</button><button class="scenario" onclick="useCase('Can you check the status of order 1002?')">Order investigation</button><div class="section">Pending approvals</div><div id="approvals"><button class="refresh" onclick="loadApprovals()">Refresh approvals</button></div></aside><main class="main"><header class="top"><b>Customer Support Resolution</b></header><section class="chat"><div class="hero" id="hero"><h1>Resolve customer issues with AI.</h1><p>Refunds above the automatic limit are routed to human approval.</p></div><div class="messages" id="messages"></div></section></main></div><div class="composer"><form class="box" id="form"><textarea id="input" placeholder="Ask about an order or refund..."></textarea><button class="send">Send</button><div class="error" id="error"></div></form></div><script>(()=>{const $=id=>document.getElementById(id),messages=$('messages'),input=$('input'),error=$('error');function add(role,text){const m=document.createElement('div');m.className='msg';m.innerHTML=`<div class="avatar">${role==='user'?'You':'AI'}</div><div><b>${role==='user'?'You':'Support Agent'}</b><div class="bubble"></div></div>`;m.querySelector('.bubble').textContent=text;messages.append(m);m.scrollIntoView({behavior:'smooth'})}window.useCase=t=>{input.value=t;input.focus()};window.newChat=()=>{messages.replaceChildren();$('hero').style.display='';input.value=''};window.loadApprovals=async()=>{try{const r=await fetch('/api/approvals/pending');const data=await r.json();$('approvals').innerHTML=data.length?data.map(a=>`<div class="approval"><b>Refund #${a.orderNumber} · ₹${a.amount}</b><p>${a.reason}</p><small>${a.id}</small><div class="actions2"><button class="approve" onclick="decide('${a.id}','approve')">Approve</button><button class="reject" onclick="decide('${a.id}','reject')">Reject</button></div></div>`).join(''):'<small style="color:#8e99a6">No pending approvals</small>'}catch(e){$('approvals').innerHTML='<small class="error">Could not load approvals</small>'}};window.decide=async(id,decision)=>{try{const reason=prompt('Decision reason (optional):')||'Reviewed by human';const r=await fetch(`/api/approvals/${id}/${decision}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decidedBy:'demo-user',reason})});if(!r.ok)throw Error('Approval action failed');await loadApprovals()}catch(e){alert(e.message)}};$('form').onsubmit=async e=>{e.preventDefault();const message=input.value.trim();if(!message)return;error.textContent='';$('hero').style.display='none';add('user',message);input.value='';try{const r=await fetch('/api/agent/resolve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'Request failed');add('agent',d.response||d.message||'No response returned.');await loadApprovals()}catch(e){error.textContent=e.message;add('agent','I could not complete that request.')} };loadApprovals()})();</script></body></html>
