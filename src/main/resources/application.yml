spring:
  application:
    name: customer-support-resolution
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/customer_support}
    username: ${DB_USERNAME:customer_support}
    password: ${DB_PASSWORD:customer_support}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: ${OPEN_AI_MODEL:gpt-5-mini}
      embedding:
        model: ${OPEN_AI_EMBEDDING_MODEL:text-embedding-3-small}
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1536
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        max-document-batch-size: 100

agent:
  enabled: ${AGENT_ENABLED:false}

rag:
  enabled: ${RAG_ENABLED:true}
  top-k: ${RAG_TOP_K:4}
  similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.60}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: Customer Support Resolution Backend
    purpose: Agent-facing business API and Agentic AI orchestrator
