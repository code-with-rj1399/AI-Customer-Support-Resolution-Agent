services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: customer-support-postgres
    environment:
      POSTGRES_DB: customer_support
      POSTGRES_USER: customer_support
      POSTGRES_PASSWORD: customer_support
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer_support -d customer_support"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: customer-support-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/customer_support
      DB_USERNAME: customer_support
      DB_PASSWORD: customer_support
      SERVER_PORT: 8080
      AGENT_ENABLED: ${AGENT_ENABLED:-true}
      RAG_ENABLED: ${RAG_ENABLED:-true}
      RAG_TOP_K: ${RAG_TOP_K:-4}
      RAG_SIMILARITY_THRESHOLD: ${RAG_SIMILARITY_THRESHOLD:-0.60}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPEN_AI_MODEL: ${OPEN_AI_MODEL:-gpt-5-mini}
      OPEN_AI_EMBEDDING_MODEL: ${OPEN_AI_EMBEDDING_MODEL:-text-embedding-3-small}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
