services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: customer-support-postgres
    environment:
      POSTGRES_DB: customer_support
      POSTGRES_USER: customer_support
      POSTGRES_PASSWORD: customer_support
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer_support -d customer_support"]
      interval: 5s
      timeout: 5s
      retries: 10

  splunk-otel-collector:
    image: quay.io/signalfx/splunk-otel-collector:latest
    container_name: splunk-otel-collector
    environment:
      SPLUNK_ACCESS_TOKEN: ${SPLUNK_ACCESS_TOKEN:-}
      SPLUNK_REALM: ${SPLUNK_REALM:-au0}
      SPLUNK_API_URL: https://api.${SPLUNK_REALM:-au0}.signalfx.com
      SPLUNK_INGEST_URL: https://ingest.${SPLUNK_REALM:-au0}.signalfx.com
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - ./observability/splunk-otel-collector-config.yaml:/etc/otel/collector.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  app:
    build: .
    container_name: customer-support-api
    depends_on:
      postgres:
        condition: service_healthy
      splunk-otel-collector:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/customer_support
      DB_USERNAME: customer_support
      DB_PASSWORD: customer_support
      SERVER_PORT: 8080
      AGENT_ENABLED: ${AGENT_ENABLED:-true}
      RAG_ENABLED: ${RAG_ENABLED:-true}
      RAG_TOP_K: ${RAG_TOP_K:-4}
      RAG_SIMILARITY_THRESHOLD: ${RAG_SIMILARITY_THRESHOLD:-0.60}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPEN_AI_MODEL: ${OPEN_AI_MODEL:-gpt-5-mini}
      OPEN_AI_EMBEDDING_MODEL: ${OPEN_AI_EMBEDDING_MODEL:-text-embedding-3-small}
      OTEL_SERVICE_NAME: spring-ai-agent
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=dev
      OTEL_EXPORTER_OTLP_ENDPOINT: http://splunk-otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    ports:
      - "8080:8080"

volumes:
  postgres_data:
